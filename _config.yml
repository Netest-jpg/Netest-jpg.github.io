title: Blog
description: Thoughts and notes
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate

paginate: 5
paginate_path: /page:num/

author:
  name: "Netest"
  bio: "hello world"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
